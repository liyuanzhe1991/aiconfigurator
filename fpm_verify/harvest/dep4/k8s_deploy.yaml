apiVersion: v1
kind: Pod
metadata:
  name: fpm-l3-dep4-agg
  labels:
    app.kubernetes.io/name: fpm-l3-dep4-agg
    app.kubernetes.io/component: fpm-resource
    kai.scheduler/queue: dynamo
    aiconfigurator.nvidia.com/owned-by: fpm-forward-collector
    aiconfigurator.nvidia.com/plan: 4df9b0f29115c63d
    aiconfigurator.nvidia.com/cell: fpm-l3-dep4
  namespace: yuanli-aic
spec:
  volumes:
  - name: model-cache
    persistentVolumeClaim:
      claimName: model-cache
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 64Gi
  imagePullSecrets:
  - name: nvcr-push-secret
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-H200
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule
  schedulerName: kai-scheduler
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values: ["computeinstance-e01cywzf37n5mecwvv"]
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  containers:
  - image: nvcr.io/0980761089281446/dynamo-fpm-frozen:gc-timing-20260818
    workingDir: /workspace/examples/backends/vllm
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: model-cache
      mountPath: /workspace/model_cache
    - name: model-cache
      mountPath: /results
      subPath: _yuanli_l3_results/r16_dep4
    - name: dshm
      mountPath: /dev/shm
    name: fpm-resource
    resources:
      limits:
        nvidia.com/gpu: '4'
    command:
    - /bin/bash
    - -lc
    args:
    - exec sleep infinity
  restartPolicy: Always
